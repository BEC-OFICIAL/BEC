<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--pr:#4f46e5;--pt:#fff;--bd:#e3e6ee;--ok:#16a34a;--er:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef0f6;--mu:#98a2b3;--pr:#5b8cff;--pt:#0b1020;--bd:#2a3140}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef0f6;--mu:#98a2b3;--pr:#5b8cff;--pt:#0b1020;--bd:#2a3140}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:light dark}
.w{max-width:520px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0 0 8px}h2{font-size:20px}h3{font-size:17px}
p{margin:4px 0;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--pr);color:var(--pt);font-weight:600;cursor:pointer;width:100%;margin-top:12px}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button:disabled{opacity:.6}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:132px;margin:20px auto 8px}
.logo div{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:30px}
.logo div:nth-child(1){background:#dbeafe}.logo div:nth-child(2){background:#fef3c7}.logo div:nth-child(3){background:#dcfce7}.logo div:nth-child(4){background:#fce7f3}

<script>

(()=>{

const dt=t=>t?new Date(t).toLocaleDateString('es'):'';
const jobOf=c=>{const k=c.dataset.k||'';return k[0]=='j'?allJobs().find(j=>String(j.id)==k.slice(1)):null};
const req=t=>{const m=t.match(/(\d+)\s*\+?\s*a[ñn]os?\s*(de\s*)?experiencia|experiencia[^.\d]{0,25}(\d+)\s*a[ñn]os?/);return m?+(m[1]||m[3]):0};
const a2=window.applyF;
window.applyF=function(){
const raw=sv,w=(raw||'').trim().split(/\s+/).filter(Boolean),multi=w.length>1;
if(multi)sv='';a2();if(multi){sv=raw;const q=$('#sj');if(q)q.value=raw}
document.querySelectorAll('.jb').forEach(c=>{if(c.style.display=='none')return;const j=jobOf(c),t=((c.dataset.t||'')+' '+((j&&j.d)||'')).toLowerCase();let ok=1;
if(multi&&!w.every(x=>t.includes(x)))ok=0;
if(xg.mun&&!t.includes(xg.mun))ok=0;
if(xg.yrs!==''&&req(t)>+xg.yrs)ok=0;
if(j&&j.exp&&j.exp<Date.now()&&j.o!=me)ok=0;
if(!ok)c.style.display='none'})};
window.xgs=(k,v)=>{xg[k]=v.toLowerCase();applyF()};
/* Fechas en cada tarjeta y campo de vencimiento al publicar */
const aj=window.addJob;
window.addJob=function(){const e=document.getElementById('jexp'),v=e&&e.value,n=jobsX.length;aj.apply(this,arguments);
if(jobsX.length>n){const j=jobsX[n];j.exp=v?new Date(v+'T23:59:59').getTime():0;if(!j.ft)j.ft=Date.now();save()}};
/* Recomendaciones */
window.recJobs=()=>{const p=(users[me]&&users[me].profile)||{},x=p.x||{};
const tok=[...new Set((x.sk||[]).concat((x.exp||[]).map(e=>e.t),(x.edu||[]).map(e=>e.t),[x.bio||'']).join(' ').toLowerCase().split(/[^a-záéíóúñ]+/).filter(s=>s.length>3))];

<script>
/* ===== Arreglos: logo = inicio, botón Hub, y datos de perfil que no se pierden al cerrar sesión ===== */
(()=>{
/* Logo / título "Job Search": recarga la página y vuelve al inicio */
document.addEventListener('click',e=>{const t=e.target.closest('.logo,.top h1,#hub header b');if(!t)return;e.preventDefault();try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}location.reload()},true);
/* Botón Hub: se oculta al bajar, vuelve al subir y no estorba con el teclado */
let ly=scrollY;
addEventListener('scroll',()=>{const y=scrollY,d=y-ly;if(Math.abs(d)<8)return;const h=d>0&&y>140;ly=y;document.querySelectorAll('#hf,#cfab').forEach(b=>b.classList.toggle('sh-hide',h))},{passive:true});
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select'))document.body.classList.add('sh-kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea,select'))document.body.classList.remove('sh-kb')},150));
/* Respaldo local del perfil por cuenta: nunca se borra al cerrar sesión ni al cambiar de cuenta */
const BK='ey_pbk_',KEYS=['nm','ap','tel','pv','ed','cn','ok','vis','pend'];
const lite=p=>{const o={};if(!p)return o;KEYS.forEach(k=>{if(p[k]!==undefined&&p[k]!=='')o[k]=p[k]});if(p.ph&&String(p.ph).length<250000)o.ph=p.ph;return o};
const filled=p=>!!(p&&((p.nm&&p.ap)||p.cn));
const rdBk=e=>{try{return JSON.parse(localStorage.getItem(BK+e))||{}}catch(x){return{}}};
function snap(){try{if(typeof me==='undefined'||!me||!users[me])return;const u=users[me],b=rdBk(me);
 [[u.role,u.profile],[u.alt&&u.alt.role,u.alt&&u.alt.profile]].forEach(([r,p])=>{if(r&&filled(p))b[r]=lite(p)});
 localStorage.setItem(BK+me,JSON.stringify(b))}catch(x){}}
function restore(){try{if(typeof me==='undefined'||!me||!users[me])return false;const u=users[me],b=rdBk(me);let ch=false;
 if(u.role&&b[u.role]&&!filled(u.profile)){u.profile=Object.assign({},u.profile||{},b[u.role]);ch=true}
 if(u.alt&&u.alt.role&&b[u.alt.role]&&!filled(u.alt.profile)){u.alt.profile=Object.assign({},u.alt.profile||{},b[u.alt.role]);ch=true}
 if(ch)save();return ch}catch(x){return false}}
const save0=save;save=function(){try{if(window.JS_CFG&&JS_CFG.url&&me&&users[me]){users[me].fav=fav;users[me].rd=rd}}catch(x){}const r=save0.apply(this,arguments);snap();return r};
const route0=route;route=function(){restore();try{if(me&&users[me]){if(users[me].fav&&!Object.keys(fav).length)fav=users[me].fav;if(users[me].rd&&!Object.keys(rd).length)rd=users[me].rd}}catch(x){}return route0.apply(this,arguments)};
/* Al cerrar sesión: guardar y sincronizar con el servidor ANTES de salir */
const out0=out;out=async function(){const a=arguments,t=this;let ok=false;
 try{save();snap();if(window.jsSync)ok=(await Promise.race([window.jsSync(),new Promise(r=>setTimeout(()=>r(false),4000))]))===true}catch(x){}
 /* Si TODO quedó guardado en el servidor, se borra la copia local (privacidad en celulares compartidos) */
 if(ok&&window.jsReset){const T=f=>{try{f()}catch(x){}};T(()=>window.jsReset());
  T(()=>['ey_fav','ey_rd','ey_cart','ey_sent','ey_dr','ey_up','ey_apl','ey_gsr','ey_pnl'].forEach(k=>localStorage.removeItem(k)));
  T(()=>{fav={}});T(()=>{rd={}});T(()=>{drafts={}});T(()=>{cart=[]})}
 return out0.apply(t,a)};

/* ---- Publicaciones de DEMOSTRACIÓN: etiquetadas y sin acciones reales ---- */
const DM='🧪 Esto es una publicación de DEMOSTRACIÓN, no es real. Nadie recibirá tu mensaje ni tu solicitud.';
const demoJob=id=>{try{const j=allJobs().find(x=>String(x.id)==String(id));return !!(j&&!j.o)}catch(x){return false}};
const demoSvc=id=>{try{const s=svc.find(x=>String(x.id)==String(id));return !!(s&&!s.u)}catch(x){return false}};
const wrap=(n,chk)=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(){if(chk.apply(null,arguments)){toast(DM);return}return f.apply(this,arguments)}};
wrap('apply',id=>demoJob(id));
wrap('reqSvc',id=>demoSvc(id));
wrap('reqForm',id=>demoSvc(id));
wrap('send',j=>demoJob(j)||(String(j)[0]=='v'&&demoSvc(String(j).slice(1))));
let mq=0;
const mark=()=>{mq=0;const r=document.getElementById('app');if(!r)return;
 r.querySelectorAll('.tag').forEach(t=>{if(t.textContent.trim()=='Ejemplo'){t.textContent='🧪 DEMO · no es real';t.classList.add('demo-tag')}});
 r.querySelectorAll('.card.sv[data-k]').forEach(c=>{if(c.dataset.dm)return;c.dataset.dm=1;const s=svc.find(x=>'s'+x.id==c.dataset.k);if(s&&!s.u){const h=c.querySelector('h3');h&&h.insertAdjacentHTML('afterend','<span class="tag demo-tag">🧪 DEMO · no es real</span>')}})};
const ap=document.getElementById('app');ap&&new MutationObserver(()=>{if(!mq){mq=1;requestAnimationFrame(mark)}}).observe(ap,{childList:true,subtree:true});mark();
/* ---- Pagos: no crear cobros que no se pueden completar ---- */
{const pb=window.planBuy;if(typeof pb==='function')window.planBuy=function(){const c=window.JS_CFG||{};if(!c.bank&&!c.card){toast('Los pagos de planes aún no están habilitados. Te avisaremos cuando estén listos.');return}return pb.apply(this,arguments)}}
{const co=window.cardPay;if(typeof co==='function')window.cardPay=function(){const c=window.JS_CFG||{};if(!c.card){toast('El pago con tarjeta aún no está disponible. Elige efectivo o transferencia.');return}return co.apply(this,arguments)}}
snap();
})();
</script>

<script>
/* ===== Registro de accesos + panel de administración ===== */
(()=>{
const isAdm=()=>{try{return !!((window.jsIsAdmin&&window.jsIsAdmin())||isA)}catch(e){return false}};
const dev=()=>{const u=navigator.userAgent||'';const os=/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':/Linux/.test(u)?'Linux':'Otro';const br=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'';return os+(br?' · '+br:'')};

/* --- Registra cada inicio de sesión / cuenta nueva dentro del perfil del usuario (se sincroniza solo) --- */
let last=me;
const rec=()=>{const u=users[me];if(!u)return;const now=Date.now(),nuevo=!u.lc&&u.tc&&now-u.tc<10*60*1000;
 const h=Array.isArray(u.lh)?u.lh:[];h.unshift({t:now,k:nuevo?'reg':'in',d:dev()});u.lh=h.slice(0,20);u.lc=(u.lc||0)+1;u.ll=now;u.la=now;if(isAdm())u.adm=true;save()};
setInterval(()=>{try{
 if(me!==last){const antes=last;last=me;if(me&&!antes)setTimeout(rec,1200);return}
 const u=me&&users[me];if(!u)return;
 if(isAdm()&&!u.adm){u.adm=true;save()}
 if(!document.hidden&&Date.now()-(u.la||0)>5*60*1000){u.la=Date.now();save()}
}catch(e){}},1500);

/* --- Aviso al administrador (llega a su campana de notificaciones) --- */
window.notifyAdm=t=>{try{Object.entries(users).forEach(([e,u])=>{if(u&&u.adm&&e!==me)notify(e,t)})}catch(e){}};

/* --- utilidades --- */
const fd=t=>t?new Date(t).toLocaleString('es-DO',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const fday=t=>{const d=new Date(t),h=new Date();h.setHours(0,0,0,0);const y=new Date(h);y.setDate(y.getDate()-1);d.setHours(0,0,0,0);return +d==+h?'Hoy':+d==+y?'Ayer':d.toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'})};
const hm=t=>new Date(t).toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});
const ago=t=>{if(!t)return 'Sin datos aún';const s=(Date.now()-t)/1000;if(s<60)return 'hace un momento';if(s<3600)return 'hace '+Math.floor(s/60)+' min';if(s<86400)return 'hace '+Math.floor(s/3600)+' h';if(s<604800)return 'hace '+Math.floor(s/86400)+' d';return fd(t)};
const hue=e=>{let h=0;for(const c of String(e))h=(h*31+c.charCodeAt(0))%360;return h};
const av=e=>`<div class="av" style="background:hsl(${hue(e)} 52% 42%)">${esc((nm2(e)||e).trim().charAt(0).toUpperCase()||'?')}</div>`;
const pl=(c,t)=>`<span class="pl ${c}">${t}</span>`;
const fm=n=>'RD$ '+Number(n||0).toLocaleString('es-DO');
const PNM={free:'Gratis',pro:'Pro',biz:'Negocio'};
const roleT=u=>u.role=='co'?'Empresa':u.role=='cl'?'Cliente':'Persona';
const bnote=()=>ls.g('ey_bnote',{});
const sv=()=>ls.s('ey_kyc',kycs);
const pend=()=>kycs.filter(k=>k.st=='pend').length;
const AD={t:'res',q:'',f:'all',n:25,ev:'all'};

const pills=(e,u)=>(u.adm?pl('in','🛡 Admin'):'')+(u.vf?pl('ok','✔ Verificado'):pl('nu','Sin verificar'))+(u.blk?pl('bad','🚫 Baneado'):'');
const evs=()=>{const out=[];for(const[e,u]of Object.entries(users)){if(!u)continue;const h=Array.isArray(u.lh)?u.lh:[];let reg=false;for(const x of h){if(x.k=='reg')reg=true;out.push({e,t:x.t,k:x.k,d:x.d})}if(!reg&&u.tc)out.push({e,t:u.tc,k:'reg',d:''})}return out.sort((a,b)=>b.t-a.t)};

/* --- Botón del perfil con contador --- */
admBtn=function(){if(!(window.jsIsAdmin&&window.jsIsAdmin()))return '';const n=pend();return `<button class="s" onclick="adm()">🛡 Panel de administración${n?` · ${n} pendiente${n>1?'s':''}`:''}</button>`};

/* --- Vistas --- */
const vRes=()=>{const U=Object.entries(users),now=Date.now(),D=864e5,E=evs();
 const n7=U.filter(([e,u])=>u.tc&&now-u.tc<7*D).length,act=U.filter(([e,u])=>Math.max(u.ll||0,u.la||0)>now-D).length,vf=U.filter(([e,u])=>u.vf).length,bn=U.filter(([e,u])=>u.blk).length;
 const op=reps.filter(r=>r.st=='Abierto').length,pp=(typeof pays!='undefined'?pays:[]).filter(p=>p.st=='Pendiente').length,pv=pend();
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13+i);return +d}),bk=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};
 const A=days.map(d=>E.filter(x=>x.k!='reg'&&bk(x.t)==d).length),B=days.map(d=>E.filter(x=>x.k=='reg'&&bk(x.t)==d).length),mx=Math.max(1,...A,...B);
 const L='DLMMJVS';
 return `<div class="kpis"><div class="kp"><span>Usuarios registrados</span><b>${U.length}</b><small>+${n7} en 7 días</small></div><div class="kp"><span>Activos en 24 h</span><b>${act}</b><small>${E.filter(x=>x.k!='reg'&&x.t>now-D).length} inicios de sesión</small></div><div class="kp"><span>Verificados</span><b>${vf}</b><small>${U.length?Math.round(vf*100/U.length):0}% de las cuentas</small></div><div class="kp ${bn?'w':''}"><span>Baneados</span><b>${bn}</b><small>${bn?'Ver en Usuarios':'Ninguno'}</small></div></div>
 <div class="pn"><h3>⚡ Requiere atención</h3>
  <div class="rw ck" onclick="adT('ver')"><div class="mn"><b>Verificaciones de identidad</b><span>Personas esperando tu aprobación para publicar</span></div>${pl(pv?'wn':'nu',pv+' pendiente'+(pv==1?'':'s'))}</div>
  <div class="rw ck" onclick="adT('rep')"><div class="mn"><b>Reportes abiertos</b><span>Denuncias de usuarios, ofertas o tiendas</span></div>${pl(op?'bad':'nu',op+' abierto'+(op==1?'':'s'))}</div>
  <div class="rw ck" onclick="adT('rep')"><div class="mn"><b>Pagos por confirmar</b><span>Planes Pro y Negocio</span></div>${pl(pp?'wn':'nu',pp+' pendiente'+(pp==1?'':'s'))}</div></div>
 <div class="two"><div class="pn"><h3>📈 Últimos 14 días</h3><div class="bars">${days.map((d,i)=>`<div title="${fday(d)}: ${A[i]} inicios, ${B[i]} registros"><div class="st"><i style="height:${Math.round(A[i]*100/mx)}%;background:var(--pr)"></i><i style="height:${Math.round(B[i]*100/mx)}%;background:var(--ok)"></i></div><small>${L[new Date(d).getDay()]}</small></div>`).join('')}</div><div class="lg"><span style="--c:var(--pr)">Inicios de sesión</span><span style="--c:var(--ok)">Cuentas nuevas</span></div></div>
 <div class="pn"><h3>🕒 Actividad reciente<em onclick="adT('act')" style="cursor:pointer;color:var(--pr)">Ver todo</em></h3>${E.length?E.slice(0,6).map(evRow).join(''):'<div class="em">Aún no hay accesos registrados.</div>'}</div></div>`};

const evRow=x=>`<div class="rw ck" onclick="adD(${ja(x.e)})">${av(x.e)}<div class="mn"><b>${esc(nm2(x.e))}</b><span>${x.k=='reg'?'Creó su cuenta':'Inició sesión'}${x.d?' · '+esc(x.d):''}</span></div><div class="rt">${pl(x.k=='reg'?'ok':'in',x.k=='reg'?'Registro':'Acceso')}<span style="font-size:12px;color:var(--mu);align-self:center">${ago(x.t)}</span></div></div>`;

const vAct=()=>{let E=evs();if(AD.ev=='reg')E=E.filter(x=>x.k=='reg');if(AD.ev=='in')E=E.filter(x=>x.k!='reg');
 const f=[['all','Todo'],['reg','Cuentas creadas'],['in','Inicios de sesión']];let g='',d='';
 for(const x of E.slice(0,150)){const k=fday(x.t);if(k!=d){d=k;g+=`<div class="dy">${esc(k[0].toUpperCase()+k.slice(1))}</div>`}g+=evRow(x)}
 return `<div class="note">Aquí ves quién creó una cuenta y quién inició sesión, con la fecha, la hora y el dispositivo. El historial empieza a guardarse desde esta versión.</div><div class="fl">${f.map(a=>`<button class="${AD.ev==a[0]?'on':''}" onclick="AD_ev('${a[0]}')">${a[1]}</button>`).join('')}</div>${g||'<div class="em">Todavía no hay movimientos para mostrar.</div>'}`};

const vVer=()=>{const P=kycs.filter(k=>k.st=='pend').sort((a,b)=>a.ts-b.ts),H=kycs.filter(k=>k.st!='pend').sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10);
 return `<div class="note">Cuando alguien pide verificarse, la solicitud llega aquí (y a tu campana de avisos). Al aprobarla, esa persona queda verificada y puede publicar.</div>
 <div class="pn"><h3>🪪 Pendientes <em>${P.length}</em></h3>${P.length?P.map(k=>`<div class="rw" style="align-items:flex-start;flex-wrap:wrap">${av(k.u)}<div class="mn"><b>${esc(k.nm||nm2(k.u))}</b><span>${esc(k.u)} · Cédula ${esc(k.ced||'')} · ${ago(k.ts)}</span><div class="kyc"><button class="ab g sm" onclick="kView('${esc(k.id)}')">Ver fotos</button><button class="ab ok sm" onclick="kOk('${esc(k.id)}',1)">✔ Aprobar</button><button class="ab gb sm" onclick="kOk('${esc(k.id)}',0)">Rechazar</button></div></div></div>`).join(''):'<div class="em">Sin solicitudes pendientes ✔</div>'}</div>
 ${H.length?`<div class="pn"><h3>Historial reciente</h3>${H.map(k=>`<div class="rw ck" onclick="adD(${ja(k.u)})">${av(k.u)}<div class="mn"><b>${esc(k.nm||nm2(k.u))}</b><span>${esc(k.u)}</span></div>${pl(k.st=='ok'?'ok':'bad',k.st=='ok'?'Aprobada':'Rechazada')}</div>`).join('')}</div>`:''}`};

const vRep=()=>{const R=reps.map((r,i)=>({r,i})).filter(x=>x.r.st=='Abierto'),Pp=(typeof pays!='undefined'?pays:[]).filter(p=>p.st=='Pendiente');
 return `<div class="pn"><h3>🚩 Reportes abiertos <em>${R.length}</em></h3>${R.length?R.map(({r,i})=>`<div class="rw" style="align-items:flex-start;flex-wrap:wrap"><div class="mn" style="white-space:normal"><b style="white-space:normal">${esc(r.r)}</b><span style="white-space:normal">${r.k=='s'?'Servicio':r.k=='j'?'Oferta':r.k=='m'?'Tienda':'Usuario'}: ${esc(repT(r))}</span>${r.c?`<span style="white-space:normal">“${esc(r.c)}”</span>`:''}<span>Reportado por ${esc(r.by)}</span><div class="kyc"><button class="ab bad sm" onclick="admAct(${i},'hide')">Ocultar / bloquear</button><button class="ab g sm" onclick="admAct(${i},'dis')">Descartar</button></div></div></div>`).join(''):'<div class="em">No hay reportes abiertos ✔</div>'}</div>
 <div class="pn"><h3>💎 Pagos por confirmar <em>${Pp.length}</em></h3>${Pp.length?Pp.map(p=>`<div class="rw">${av(p.u)}<div class="mn"><b>${esc(p.u)}</b><span>Plan ${PNM[p.pl]||esc(p.pl)} · ${fm(p.amt)} · Ref ${esc(p.ref||'')}</span></div><button class="ab ok sm" onclick="payOk('${esc(p.id)}')">Confirmar</button></div>`).join(''):'<div class="em">Sin pagos pendientes ✔</div>'}</div>`};

const TABS=()=>[['res','Resumen'],['ver','Verificaciones',pend()],['usr','Usuarios'],['act','Actividad'],['rep','Reportes y pagos',reps.filter(r=>r.st=='Abierto').length]];

 <div class="tabs" role="tablist">${TABS().map(t=>`<button role="tab" class="${AD.t==t[0]?'on':''}" onclick="adT('${t[0]}')">${t[1]}${t[2]?`<i>${t[2]}</i>`:''}</button>`).join('')}</div>${V[AD.t]()}</div>`;

/* --- Ficha de usuario (historial de accesos + acciones) --- */

window.adD=e=>{const u=users[e];if(!u)return;const k=kycs.find(x=>x.u==e),h=Array.isArray(u.lh)?u.lh:[],bn=bnote()[e],me0=e==me;
 sheet(`<div style="display:flex;align-items:center;gap:12px">${av(e)}<div style="flex:1;min-width:0"><h3 style="margin:0">${esc(nm2(e))}</h3><p style="margin:2px 0;word-break:break-all">${esc(e)}</p></div><button class="ab g sm" onclick="document.getElementById('adsh').remove()">✕</button></div>

 ${u.blk&&bn?`<div class="note" style="margin-top:12px;border-color:var(--er)">Motivo del baneo: ${esc(bn.why||'sin motivo')}${bn.at?' · '+fd(bn.at):''}</div>`:''}
 <div class="kv"><div><span>Cuenta creada</span><b>${fd(u.tc)}</b></div><div><span>Último acceso</span><b>${u.ll||u.la?fd(u.ll||u.la):'Sin datos aún'}</b></div><div><span>Inicios de sesión</span><b>${u.lc||0}</b></div><div><span>Tipo de cuenta</span><b>${roleT(u)}</b></div><div><span>Plan</span><b>${PNM[(u.plan&&u.plan.exp>Date.now()&&u.plan.id)||'free']}</b></div><div><span>Verificación de identidad</span><b>${u.vf?'Aprobada':k?(k.st=='pend'?'En revisión':k.st=='no'?'Rechazada':'Aprobada'):'No solicitada'}</b></div></div>
 <h4>Historial de accesos</h4>${h.length?h.map(x=>`<div class="ha"><div>${x.k=='reg'?'🆕 Creó su cuenta':'🔑 Inició sesión'}</div><span>${fd(x.t)}${x.d?'<br>'+esc(x.d):''}</span></div>`).join(''):'<p>Aún no hay accesos registrados para esta cuenta.</p>'}
 ${u.adm||me0?'<p style="margin-top:14px">Esta es una cuenta de administrador: no se puede banear desde aquí.</p>':`<div class="ac">${u.vf?`<button class="ab g" onclick="adVf(${ja(e)},0)">Quitar verificación</button>`:`<button class="ab ok" onclick="adVf(${ja(e)},1)">✔ Verificar</button>`}${u.blk?`<button class="ab" onclick="adUnban(${ja(e)})">Desbanear</button>`:`<button class="ab bad" onclick="adBan(${ja(e)})">🚫 Banear</button>`}</div>`}`)};
window.adVf=(e,v)=>{const u=users[e];if(!u)return;u.vf=!!v;if(v){u.vfAt=Date.now();const k=kycs.find(x=>x.u==e&&x.st=='pend');if(k){k.st='ok';sv()}notify(e,'✔ Tu cuenta fue verificada. Ya puedes publicar.')}save();toast(v?'✔ Usuario verificado':'Verificación retirada');AD.keep=0;admin();adD(e)};
window.adBan=e=>{sheet(`<h3 style="margin:0 0 6px">Banear a ${esc(nm2(e))}</h3><p>Perderá el acceso a su cuenta y no podrá volver a entrar. Puedes desbanearlo cuando quieras.</p><label>Motivo (solo lo ves tú)</label><textarea id="adr" maxlength="200" placeholder="Ej.: publicaciones falsas, acoso, estafa…"></textarea><div class="ac"><button class="ab g" onclick="adD(${ja(e)})">Cancelar</button><button class="ab bad" onclick="adBanGo(${ja(e)})">Confirmar baneo</button></div>`)};
window.adBanGo=e=>{const u=users[e];if(!u||u.adm||e==me)return;const why=(document.getElementById('adr')||{}).value||'';u.blk=true;u.blkAt=Date.now();const b=bnote();b[e]={why:why.trim().slice(0,200),at:Date.now()};ls.s('ey_bnote',b);save();toast('🚫 Usuario baneado');admin();adD(e)};
window.adUnban=e=>{const u=users[e];if(!u)return;u.blk=false;delete u.blkAt;const b=bnote();delete b[e];ls.s('ey_bnote',b);save();toast('Usuario desbaneado');admin();adD(e)};
/* compatibilidad con botones antiguos */
window.admVf=e=>adVf(e,!users[e].vf);window.admBlk=e=>users[e]&&users[e].blk?adUnban(e):adBan(e);

<style>

<script>
/* ===== Panel de administración conectado al servidor (Supabase) =====
   Lee admin_stats / adm_users / activity_log y banea o verifica con adm_user_set.
   Escucha activity_log en tiempo real: cada inicio de sesión aparece al instante. */
(()=>{
const SB=window.jsSB;if(!SB||!window.admin)return;
const TOP='realtime:adm_log',SV={st:null,us:null,ac:[],err:'',t:0,busy:0,q:'',f:'all',n:25,ev:'all',live:0};
let ws=null,hb=0,tk=0,rf=0,dt=0,qt=0;
const isAd=()=>{try{return !!(window.jsIsAdmin&&window.jsIsAdmin())}catch(e){return false}};
const fd=s=>s?new Date(s).toLocaleString('es-DO',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const fday=s=>{const d=new Date(s),h=new Date();h.setHours(0,0,0,0);const y=new Date(h);y.setDate(y.getDate()-1);d.setHours(0,0,0,0);return +d==+h?'Hoy':+d==+y?'Ayer':d.toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'})};
const ago=s=>{if(!s)return 'Sin datos aún';const x=(Date.now()-new Date(s))/1000;if(x<60)return 'hace un momento';if(x<3600)return 'hace '+Math.floor(x/60)+' min';if(x<86400)return 'hace '+Math.floor(x/3600)+' h';if(x<604800)return 'hace '+Math.floor(x/86400)+' d';return fd(s)};
const hue=e=>{let h=0;for(const c of String(e))h=(h*31+c.charCodeAt(0))%360;return h};
const av=e=>`<div class="av" style="background:hsl(${hue(e)} 52% 42%)">${esc(String(e||'?').trim().charAt(0).toUpperCase()||'?')}</div>`;
const pl=(c,t)=>`<span class="pl ${c}">${t}</span>`;
const pills=u=>(u.adm?pl('in','🛡 Admin'):'')+(u.vf?pl('ok','✔ Verificado'):pl('nu','Sin verificar'))+((u.blk||u.banned)?pl('bad','🚫 Baneado'):'');

/* --- acceso al servidor --- */
async function tok(){const S=SB.sess();if(S&&S.exp-Date.now()<60000){try{await window.jsSync()}catch(e){}}}
const rpc=(fn,b)=>SB.api('/rest/v1/rpc/'+fn,{m:'POST',b:b||{}});
const et=r=>{const m=(r&&r.j&&(r.j.message||r.j.msg||r.j.error))||'';return(/forbidden|42501|permission denied/i.test(m)||(r&&(r.s==401||r.s==403)))?'NOADM':(m||('Error '+(r&&r.s)))};
async function load(force){
 if(SV.busy)return;if(!force&&Date.now()-SV.t<10000)return;SV.busy=1;
 try{await tok();
  const [a,b,c]=await Promise.all([rpc('adm_stats'),SB.api('/rest/v1/activity_log?select=id,actor_email,action,summary,created_at&order=created_at.desc&limit=200'),rpc('adm_users',{p_q:SV.q||null,p_flt:SV.f,p_lim:SV.n,p_off:0})]);
  SV.err='';
  if(a.ok)SV.st=a.j;else SV.err=et(a);
  if(b.ok&&Array.isArray(b.j))SV.ac=b.j;else if(!SV.err)SV.err=et(b);
  if(c.ok)SV.us=c.j;else if(!SV.err)SV.err=et(c);
 }catch(e){SV.err='No se pudo conectar con el servidor.'}
 SV.t=Date.now();SV.busy=0;paint()}
async function loadUs(){try{await tok();const c=await rpc('adm_users',{p_q:SV.q||null,p_flt:SV.f,p_lim:SV.n,p_off:0});if(c.ok)SV.us=c.j;else SV.err=et(c)}catch(e){}paint()}

/* --- vistas --- */
const banner=()=>(SV.err?`<div class="note" style="border-color:var(--er);color:var(--er)">${SV.err=='NOADM'?'El servidor no te reconoce como administrador. Ejecuta el paso 8 del SQL (con tu correo), cierra sesión y vuelve a entrar.':esc(SV.err)}</div>`:'')+`<div style="font-size:12px;color:var(--mu);margin:0 2px 10px">${SV.live?'<span class="lv"></span>En vivo':'Sin conexión en vivo (se reintenta solo)'}</div>`;
const evT=a=>a.action=='signup'?'Creó su cuenta':a.action=='login'?'Inició sesión':(a.summary||a.action);
const evK=a=>a.action=='signup'?pl('ok','Registro'):a.action=='login'?pl('in','Acceso'):/^(admin_|user_)/.test(a.action)?pl('wn','Admin'):pl('nu','Evento');
const evRow=a=>{const e=a.actor_email||'';return `<div class="rw ${e?'ck':''}" ${e?`onclick="admSV.open(${ja(e)})"`:''}>${av(e)}<div class="mn"><b>${esc(e||'Sistema')}</b><span>${esc(evT(a))}</span></div><div class="rt">${evK(a)}<span style="font-size:12px;color:var(--mu);align-self:center">${ago(a.created_at)}</span></div></div>`};
const vRes=()=>{const s=SV.st||{},E=SV.ac;
 const on=typeof users!='undefined'?Object.values(users).filter(u=>u&&(u.la||0)>Date.now()-6*60000).length:0;
 const days=(s.series||[]),mx=Math.max(1,...days.map(x=>x.login),...days.map(x=>x.reg)),L='DLMMJVS';
 const row=(t,sub,n,c,tab)=>`<div class="rw ck" onclick="adT('${tab}')"><div class="mn"><b>${t}</b><span>${sub}</span></div>${pl(n?c:'nu',n+' pendiente'+(n==1?'':'s'))}</div>`;
 return banner()+`<div class="kpis"><div class="kp"><span>Usuarios registrados</span><b>${s.users??'—'}</b><small>+${s.users_7d??0} en 7 días</small></div><div class="kp"><span>Activos en 24 h</span><b>${s.active_24h??'—'}</b><small>${on} en línea ahora (aprox.)</small></div><div class="kp"><span>Verificados</span><b>${s.verified??'—'}</b><small>${s.users?Math.round((s.verified||0)*100/s.users):0}% de las cuentas</small></div><div class="kp ${s.blocked?'w':''}"><span>Baneados</span><b>${s.blocked??'—'}</b><small>${s.blocked?'Ver en Usuarios':'Ninguno'}</small></div></div>
 <div class="pn"><h3>⚡ Requiere atención</h3>${row('Verificaciones de identidad','Personas esperando tu aprobación',s.kyc_pending||0,'wn','ver')}${row('Reportes abiertos','Denuncias de usuarios, ofertas o tiendas',s.reports_open||0,'bad','rep')}${row('Pagos por confirmar','Planes Pro y Negocio',s.pays_pending||0,'wn','rep')}</div>
 <div class="two"><div class="pn"><h3>📈 Últimos 14 días</h3><div class="bars">${days.map(x=>`<div title="${x.d}: ${x.login} inicios, ${x.reg} registros"><div class="st"><i style="height:${Math.round(x.login*100/mx)}%;background:var(--pr)"></i><i style="height:${Math.round(x.reg*100/mx)}%;background:var(--ok)"></i></div><small>${L[new Date(x.d+'T00:00:00').getDay()]}</small></div>`).join('')}</div><div class="lg"><span style="--c:var(--pr)">Inicios de sesión</span><span style="--c:var(--ok)">Cuentas nuevas</span></div></div>
 <div class="pn"><h3>🕒 Actividad reciente<em onclick="adT('act')" style="cursor:pointer;color:var(--pr)">Ver todo</em></h3>${E.filter(a=>a.action=='login'||a.action=='signup').slice(0,6).map(evRow).join('')||'<div class="em">Aún no hay accesos registrados.</div>'}</div></div>`};
const vAct=()=>{let E=SV.ac;
 if(SV.ev=='reg')E=E.filter(a=>a.action=='signup');else if(SV.ev=='in')E=E.filter(a=>a.action=='login');else if(SV.ev=='adm')E=E.filter(a=>/^admin_|^user_/.test(a.action));
 const f=[['all','Todo'],['in','Inicios de sesión'],['reg','Cuentas creadas'],['adm','Acciones admin']];let g='',d='';
 for(const a of E.slice(0,150)){const k=fday(a.created_at);if(k!=d){d=k;g+=`<div class="dy">${esc(k[0].toUpperCase()+k.slice(1))}</div>`}g+=evRow(a)}
 return banner()+`<div class="fl">${f.map(a=>`<button class="${SV.ev==a[0]?'on':''}" onclick="admSV.setEv('${a[0]}')">${a[1]}</button>`).join('')}</div>${g||'<div class="em">Todavía no hay movimientos para mostrar.</div>'}`};
const uRow=u=>`<div class="rw ck" onclick="admSV.open(${ja(u.email)})">${av(u.email)}<div class="mn"><b>${esc(u.name||u.email)}</b><span>${esc(u.email)} · ${ago(u.last_sign_in_at||u.created_at)}</span></div><div class="rt">${pills(u)}</div></div>`;
const uList=()=>{const R=(SV.us&&SV.us.rows)||[],T=(SV.us&&SV.us.total)||0;return(R.length?R.map(uRow).join(''):'<div class="em">No hay usuarios con ese filtro.</div>')+(T>R.length?`<button class="ab g more" onclick="admSV.more()">Mostrar más (${T-R.length})</button>`:'')};
const vUsr=()=>{const f=[['all','Todos'],['new','Nuevos (7 d)'],['nov','Sin verificar'],['ver','Verificados'],['ban','Baneados']];
 return banner()+`<div class="tb"><input id="admq" type="search" placeholder="Buscar por nombre o correo…" value="${esc(SV.q)}" oninput="admSV.setQ(this.value)"></div><div class="fl">${f.map(a=>`<button class="${SV.f==a[0]?'on':''}" onclick="admSV.setF('${a[0]}')">${a[1]}</button>`).join('')}</div><div class="pn" id="admul">${uList()}</div>`};

/* --- ficha de usuario --- */
const sheet=h=>{let s=document.getElementById('adsh');if(!s){s=document.createElement('div');s.id='adsh';s.onclick=e=>{if(e.target===s)s.remove()};document.body.appendChild(s)}s.innerHTML=`<div role="dialog" aria-modal="true">${h}</div>`};
const closeS=()=>{const s=document.getElementById('adsh');if(s)s.remove()};
const find=e=>((SV.us&&SV.us.rows)||[]).find(u=>u.email==e)||{email:e};
async function act(email,patch,why,msg){
 await tok();const r=await rpc('adm_user_set',{p_email:email,p_patch:patch,p_reason:why||null});
 if(!r.ok){const m=et(r);toast('No se pudo: '+(m=='NOADM'?'tu sesión no es de administrador':m));return false}
 if(patch.vf===true){try{const k=kycs.find(x=>x.u==email&&x.st=='pend');if(k){k.st='ok';ls.s('ey_kyc',kycs)}notify(email,'✔ Tu cuenta fue verificada. Ya puedes publicar.')}catch(e){}}
 toast(msg);try{window.jsSync&&window.jsSync()}catch(e){}
 await load(true);return true}
window.admSV={
 setQ(v){SV.q=v;SV.n=25;clearTimeout(qt);qt=setTimeout(loadUs,350)},
 setF(f){SV.f=f;SV.n=25;loadUs()},
 setEv(k){SV.ev=k;paint()},
 more(){SV.n+=25;loadUs()},
 open(e){const u=find(e),h=SV.ac.filter(a=>a.actor_email==e&&(a.action=='login'||a.action=='signup')).slice(0,15),me0=typeof me!='undefined'&&e==me;
  sheet(`<div style="display:flex;align-items:center;gap:12px">${av(e)}<div style="flex:1;min-width:0"><h3 style="margin:0">${esc(u.name||e)}</h3><p style="margin:2px 0;word-break:break-all">${esc(e)}</p></div><button class="ab g sm" onclick="document.getElementById('adsh').remove()">✕</button></div>
  <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${pills(u)}</div>
  <div class="kv"><div><span>Cuenta creada</span><b>${fd(u.created_at)}</b></div><div><span>Último acceso</span><b>${u.last_sign_in_at?fd(u.last_sign_in_at):'Sin datos aún'}</b></div><div><span>Tipo de cuenta</span><b>${u.role=='co'?'Empresa':u.role=='cl'?'Cliente':'Persona'}</b></div><div><span>Plan</span><b>${esc(u.plan||'free')}</b></div></div>
  <h4>Historial de accesos</h4>${h.length?h.map(a=>`<div class="ha"><div>${a.action=='signup'?'🆕 Creó su cuenta':'🔑 Inició sesión'}</div><span>${fd(a.created_at)}</span></div>`).join(''):'<p>Aún no hay accesos registrados para esta cuenta.</p>'}
  ${u.adm||me0?'<p style="margin-top:14px">Esta es una cuenta de administrador: no se puede banear desde aquí.</p>':`<div class="ac">${u.vf?`<button class="ab g" onclick="admSV.vf(${ja(e)},0)">Quitar verificación</button>`:`<button class="ab ok" onclick="admSV.vf(${ja(e)},1)">✔ Verificar</button>`}${(u.blk||u.banned)?`<button class="ab" onclick="admSV.unban(${ja(e)})">Desbanear</button>`:`<button class="ab bad" onclick="admSV.banForm(${ja(e)})">🚫 Banear</button>`}</div>`}`)},
 async vf(e,v){if(await act(e,{vf:!!v},null,v?'✔ Usuario verificado':'Verificación retirada'))window.admSV.open(e)},
 banForm(e){sheet(`<h3 style="margin:0 0 6px">Banear a ${esc(find(e).name||e)}</h3><p>Perderá el acceso a su cuenta y no podrá volver a entrar. Puedes desbanearlo cuando quieras.</p><label>Motivo (solo lo ves tú)</label><textarea id="adr" maxlength="200" placeholder="Ej.: publicaciones falsas, acoso, estafa…"></textarea><div class="ac"><button class="ab g" onclick="admSV.open(${ja(e)})">Cancelar</button><button class="ab bad" onclick="admSV.banGo(${ja(e)})">Confirmar baneo</button></div>`)},
 async banGo(e){const why=((document.getElementById('adr')||{}).value||'').trim().slice(0,200);if(await act(e,{blk:true},why,'🚫 Usuario baneado'))window.admSV.open(e)},
 async unban(e){if(await act(e,{blk:false},null,'Usuario desbaneado'))window.admSV.open(e)}
};

/* --- tiempo real: cada fila nueva en activity_log llega al instante --- */
const snd=(t,e,p)=>{if(ws&&ws.readyState==1)ws.send(JSON.stringify({topic:t,event:e,payload:p,ref:String(++rf)}))};
function onEv(p){try{const r=p&&p.data&&p.data.record;
  if(r&&r.actor_email&&(typeof me=='undefined'||r.actor_email!==me)){if(r.action=='login')toast('🔑 '+r.actor_email+' inició sesión');else if(r.action=='signup')toast('🆕 Cuenta nueva: '+r.actor_email)}}catch(e){}
 clearTimeout(dt);dt=setTimeout(()=>{if(document.getElementById('admsv'))load(true);else SV.t=0},600)}
function rtOpen(){const S=SB.sess();if(!S||ws||!isAd())return;
 try{ws=new WebSocket(SB.U.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB.K)+'&vsn=1.0.0')}catch(e){ws=null;return}
 ws.onopen=()=>{snd(TOP,'phx_join',{config:{broadcast:{self:false},presence:{key:''},postgres_changes:[{event:'INSERT',schema:'public',table:'activity_log'}]},access_token:S.at});hb=setInterval(()=>snd('phoenix','heartbeat',{}),25000);tk=setInterval(()=>{const s=SB.sess();if(s)snd(TOP,'access_token',{access_token:s.at})},240000)};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.event=='phx_reply'&&m.topic==TOP){SV.live=m.payload&&m.payload.status=='ok'?1:0;paint();return}
  if(m.event=='postgres_changes')onEv(m.payload);
  else if(m.event=='phx_error'||m.event=='phx_close'){try{ws.close()}catch(e){}}};
 ws.onclose=()=>{clearInterval(hb);clearInterval(tk);ws=null;SV.live=0;paint()};
 ws.onerror=()=>{try{ws.close()}catch(e){}}}
setInterval(()=>{if(isAd()){if(!ws)rtOpen()}else if(ws){const w=ws;ws=null;SV.live=0;w.onclose=null;clearInterval(hb);clearInterval(tk);try{w.close()}catch(e){}}},5000);

/* --- el panel: pestañas Resumen / Usuarios / Actividad pasan a leer del servidor --- */
const orig=window.admin;
window.admin=function(){
 orig.apply(this,arguments);
 const root=document.querySelector('#app .adm');if(!root||!isAd())return;
 rtOpen();
 const t=window.AD&&window.AD.t;if(t!='res'&&t!='usr'&&t!='act')return;
 const tabs=root.querySelector('.tabs');if(!tabs)return;
 while(tabs.nextSibling)tabs.nextSibling.remove();
 const box=document.createElement('div');box.id='admsv';root.appendChild(box);
 paint();load(false)};
if(typeof window.adm=='function'){const a0=window.adm;window.adm=async function(){SV.t=0;return a0.apply(this,arguments)}}
})();
</script>
